name: price_calculator
description: "A professional mobile calculator app for shops that sell products by weight"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Uncomment below after adding app_icon.png to assets/icon/ folder
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
